[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zen-profile-selector"
version = "0.1.0"
description = "Unofficial profile picker for Zen Browser on Linux"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Federico Grimaldi" }]
requires-python = ">=3.9"
dependencies = ["customtkinter>=5.2"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Environment :: X11 Applications",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pre-commit>=4"]

[project.scripts]
zen-profile-selector = "zen_profile_selector.app:main"

[project.urls]
Homepage = "https://github.com/FedericoGrim/zen-profile-selector"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zen_profile_selector = ["assets/*"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
