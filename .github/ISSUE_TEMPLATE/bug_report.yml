name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please check the [existing issues](https://github.com/FedericoGrim/zen-profile-selector/issues) first.
        Security problems must be reported privately, see [SECURITY.md](https://github.com/FedericoGrim/zen-profile-selector/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the selector
        2. Click ✎ on a profile
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: zen-profile-selector version
      description: Run `pipx list` and copy the version.
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: zen-install
    attributes:
      label: How is Zen installed?
      options:
        - Flatpak (app.zen_browser.zen)
        - Native package (deb, AUR, tarball, AppImage)
        - Other / not sure
    validations:
      required: true
  - type: input
    id: zen-version
    attributes:
      label: Zen version
      description: Found in Zen under Settings → About.
      placeholder: "1.23.2b"
  - type: input
    id: distro
    attributes:
      label: Linux distribution and desktop
      placeholder: "Linux Mint 22, Cinnamon"
    validations:
      required: true
  - type: dropdown
    id: display-server
    attributes:
      label: Display server
      options:
        - X11
        - Wayland
        - Not sure
  - type: textarea
    id: logs
    attributes:
      label: Terminal output
      description: Start `zen-profile-selector` from a terminal and paste any error. Remove personal paths or profile names if you prefer.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
